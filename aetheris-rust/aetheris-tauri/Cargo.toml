[package]
name = "aetheris-tauri"
version = "0.1.0"
edition = "2021"
description = "Aetheris UI - Tauri Desktop Shell"
authors = ["Carlos Ivan Obando Aure"]
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
